name: Agent evaluation smoke

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate-and-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt pytest pytest-asyncio
      - name: Verify release scorer and local Agent contracts
        run: >-
          python -m pytest -q
          tests/test_agent_gate.py tests/test_after_sales.py tests/test_appointment_writes.py
          tests/test_appointment_handoff.py tests/test_local_slot_confirmation.py
          tests/test_conversation_memory.py tests/test_long_term_memory.py
